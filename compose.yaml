
name: florarte

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: florarte
      POSTGRES_USER: florarte_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U florarte_app -d florarte"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./Flor_Arte_Backend
    image: florarte-backend:dev
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/florarte
      SPRING_DATASOURCE_USERNAME: florarte_app
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?Configura DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET}
      JWT_EXPIRATION: "3600"
      AUTH_CODE_SECRET: ${AUTH_CODE_SECRET:?Configura AUTH_CODE_SECRET}
      AUTH_RECOVERY_URL: http://localhost:8081/restablecer-contrasena
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8081"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./Flor_Arte_Fronted
      args:
        VITE_API_URL: /api
    image: florarte-frontend:dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend

volumes:
  postgres_data:
