name: FlorArte - Probar conexion AWS

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Verificar AWS OIDC
    runs-on: ubuntu-24.04
    environment: production

    steps:
      - name: Configurar credenciales AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: FlorArteOIDCTest

      - name: Verificar identidad AWS
        run: |
          aws sts get-caller-identity \
            --query '{Account:Account,Arn:Arn}' \
            --output table

      - name: Confirmar conexion
        run: |
          echo "Conexion GitHub Actions -> AWS OIDC exitosa."
          echo "No se realizaron cambios en EC2 ni Docker."