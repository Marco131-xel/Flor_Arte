
name: FlorArte - Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [develop, main]
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar y probar Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flor_Arte_Backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Flor_Arte_Backend/pom.xml

      - name: Dar permisos a Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas y compilar
        run: ./mvnw -B -ntp verify

      - name: Guardar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: Flor_Arte_Backend/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
