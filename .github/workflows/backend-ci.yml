
name: FlorArte - Backend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches: [develop, main]
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Pruebas unitarias y compilacion
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flor_Arte_Backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Flor_Arte_Backend/pom.xml

      - name: Preparar Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas y compilar
        run: ./mvnw -B -ntp verify

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: Flor_Arte_Backend/target/surefire-reports/
          if-no-files-found: warn

  integration:
    name: Pruebas de integracion PostgreSQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: florarte_test
          POSTGRES_USER: florarte_test
          POSTGRES_PASSWORD: ci_only_florarte_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U florarte_test -d florarte_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: Flor_Arte_Backend

    env:
      FLORARTE_TEST_DB_PASSWORD: ci_only_florarte_2026
      JWT_SECRET: clave-exclusiva-ci-florarte-2026-0123456789
      JWT_EXPIRATION: "3600"
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Flor_Arte_Backend/pom.xml

      - name: Preparar Maven
        run: chmod +x mvnw

      - name: Ejecutar pruebas de integracion
        run: >
          ./mvnw -B -ntp
          -Dtest=SeguridadCorreoIntegrationTest,FlorArteBackendApplicationTests
          -Dflorarte.test.db=jdbc:postgresql://127.0.0.1:5432/florarte_test
          verify

      - name: Guardar resultados de integracion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-integration-reports
          path: Flor_Arte_Backend/target/surefire-reports/
          if-no-files-found: warn
