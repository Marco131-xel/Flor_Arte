
name: FlorArte - Backend CI

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  pull_request:
    branches:
      - develop
      - main
    paths:
      - "Flor_Arte_Backend/**"
      - ".github/workflows/backend-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Compilar Spring Boot
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Flor_Arte_Backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: Flor_Arte_Backend/pom.xml

      - name: Verificar Java
        run: java -version

      - name: Dar permisos a Maven Wrapper
        run: chmod +x mvnw

      - name: Compilar backend
        run: ./mvnw -B -ntp -DskipTests package
