# Configuracion fail-closed: no cambia credenciales de servicios en ejecucion.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
CORS_ALLOWED_ORIGINS=${PRODUCTION_CORS_ORIGINS}
florarte.auth.recovery-url=${AUTH_RECOVERY_URL}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
florarte.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
florarte.security.hide-internal-errors=true
florarte.bootstrap.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
florarte.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:}
florarte.bootstrap.nombre=${BOOTSTRAP_ADMIN_NAME:}
florarte.bootstrap.hash-file=${BOOTSTRAP_ADMIN_HASH_FILE:}
